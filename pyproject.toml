[project]
name = "kurukshetra-lit"
version = "0.1.0"
description = "kurukshetra-asr/1 wrapper that puts LIT's Nemotron 3.5 into the ASR Kurukshetra arena"
readme = "README.md"
authors = [
    { name = "uday-kapture", email = "uday.sharma@kapturecrm.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.2",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
kurukshetra-lit = "kurukshetra_lit:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
